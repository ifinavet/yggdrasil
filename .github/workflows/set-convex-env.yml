name: Set Convex env

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  set-env:
    name: Push SLACK_BOT_TOKEN to Convex
    if: github.repository == 'ifinavet/yggdrasil' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check secrets
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          : "${CONVEX_DEPLOY_KEY:?Set the production CONVEX_DEPLOY_KEY secret}"
          : "${SLACK_BOT_TOKEN:?Set the SLACK_BOT_TOKEN secret}"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Set SLACK_BOT_TOKEN on the production deployment
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          printf '%s' "$SLACK_BOT_TOKEN" \
            | pnpm --dir packages/backend exec convex env set SLACK_BOT_TOKEN --force
