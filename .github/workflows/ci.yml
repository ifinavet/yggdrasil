name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_PUBLIC_CONVEX_URL: https://gate-has-no-backend.convex.cloud

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-workspace
      - run: pnpm lint

  check-types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-workspace
      - run: pnpm check-types

  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-workspace
      - run: pnpm compile

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-workspace
      - run: pnpm test

  email-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-workspace
      - name: Preview server boots and renders a template
        run: |
          pnpm --filter @workspace/emails dev > email-preview.log 2>&1 &
          for _ in $(seq 60); do
            curl -sf http://localhost:3030/preview/admissions-offer-email -o /dev/null && exit 0
            sleep 2
          done
          cat email-preview.log
          exit 1

  deploy-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Production deploy key only deploys, it cannot run functions
        run: |
          if tr '\\\n' '  ' < .github/workflows/deploy-production.yml | grep -Eq 'convex[[:space:]]+run'; then
            echo "::error file=.github/workflows/deploy-production.yml::convex run needs permissions the production deploy key does not have. Seed data through an admin-gated mutation in the app instead."
            exit 1
          fi
