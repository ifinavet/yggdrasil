version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # These package families must move together, including security fixes.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      react-security:
        applies-to: security-updates
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      vitest-security:
        applies-to: security-updates
        patterns: ["vitest", "@vitest/*"]
      # The tiptap packages are version-locked to each other by exact peer
      # dependencies (@tiptap/react@3.x requires @tiptap/core@3.x and
      # @tiptap/pm@3.x). Updating one of them alone breaks the Next.js build
      # with "export ... doesn't exist in target module", so the whole family
      # must always move in a single pull request, majors included.
      tiptap:
        patterns: ["@tiptap*"]
      tiptap-security:
        applies-to: security-updates
        patterns: ["@tiptap*"]
      minor-and-patch:
        exclude-patterns: ["@tiptap*", "react", "react-dom", "@types/react", "@types/react-dom", "vitest", "@vitest/*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
