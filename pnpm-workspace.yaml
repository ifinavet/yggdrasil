  "@sentry/nextjs": "11.10.0"
  "@tailwindcss/postcss": "4.3.3"
  "@tailwindcss/typography": "0.5.20"
  "@tanstack/react-form": "1.33.5"
  "@tanstack/react-table": "8.21.3"
  "@tiptap/extension-placeholder": "3.32.0"
  "@tiptap/pm": "3.32.0"
  "@tiptap/react": "3.32.0"
  "@tiptap/starter-kit": "3.32.0"
  "@types/node": "20.19.43"
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  "class-variance-authority": "0.7.1"
  "clsx": "2.1.1"
  "cmdk": "1.1.1"
  "convex": "1.48.0"
  "date-fns": "4.4.0"
  "lucide-react": "1.64.0"
  "marked": "18.1.2"
  "next": "16.4.3"
  "next-themes": "0.4.6"
  "posthog-js": "1.442.1"
  "radix-ui": "1.8.1"
  "react": "19.3.1"
  "react-day-picker": "10.0.2"
  "react-dom": "19.3.1"
  "recharts": "3.10.1"
  "sass": "1.107.0"
  "sonner": "2.0.8"
  "tailwind-merge": "3.7.0"
  "tailwindcss": "4.3.3"
  "tw-animate-css": "1.4.0"
  "typescript": "7.0.2"
  "vitest": "5.0.5"
  "zod": "4.6.7"
  "zustand": "5.0.16"

# Keep transitive framework copies aligned with the same updatable catalog.
overrides:
  "next": "catalog:"
  # Typography pins a vulnerable parser; use the patched release until upstream updates.
  "@tailwindcss/typography>postcss-selector-parser": "7.1.6"
  "react": "catalog:"
  "react-dom": "catalog:"
  "@types/react": "catalog:"
  "@types/react-dom": "catalog:"
